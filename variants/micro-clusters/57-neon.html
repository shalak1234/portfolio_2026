<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shalak Bhavsar</title>
<style>@font-face{font-family:Archivo;src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Bebas;src:url(fonts/bebas-neue-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:Instrument;src:url(fonts/instrument-serif-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Instrument;font-style:italic;src:url(fonts/instrument-serif-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:Silk;src:url(fonts/silkscreen-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Doto;font-weight:900;src:url(fonts/doto-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:VT;src:url(fonts/vt323-latin-400-normal.woff2) format('woff2')}
:root{--bg:#120b14;--fg:#ff4fd8;--grain:.08}*,*::before,*::after{box-sizing:border-box}html,body{margin:0;height:100%}
body{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--fg);position:relative}
body::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:var(--grain,.06);mix-blend-mode:overlay;pointer-events:none}
.r{display:flex;align-items:center}.c{display:flex;flex-direction:column}
.m{font:500 9.5px/1.25 Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 9px;border:1.4px solid currentColor;border-radius:99px;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bx{display:inline-flex;align-items:center;height:18px;padding:0 7px;border:1.4px solid currentColor;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.bx.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cds{display:inline-flex}.cd{font:600 9.5px Plex;font-style:normal;width:17px;height:17px;border:1.3px solid currentColor;border-radius:50%;display:grid;place-items:center;margin-left:-2px;background:var(--bg)}
.cd:first-child{margin-left:0}
.sep{height:1.4px;background:currentColor;align-self:stretch}
.dash{border-top:1.4px dashed currentColor;align-self:stretch}
.cluster{position:relative}
.ne{font:italic 66px/1 Instrument;color:#ffe6fb;text-shadow:0 0 4px #fff,0 0 14px #ff4fd8,0 0 30px #ff4fd8,0 0 60px #ff1fbf}
.op{font:600 16px Plex;letter-spacing:.4em;color:#e9fffb;text-shadow:0 0 6px #4ffff0,0 0 16px #20e0d0}.sc{width:7px;height:7px;border-radius:50%;background:#56505a}</style></head><body><main class="cluster" aria-label="Shalak Bhavsar"><div class="c " style="gap:14px;align-items:center"><div class="r " style="gap:40px;"><i class="sc"></i><span class="op" style="">OPEN LATE</span><i class="sc"></i></div><span class="ne" style="">Shalak Bhavsar</span><span class="m" style="color:#8a7f8f">— 120V · 2 tubes · hand bent —</span></div></main></body></html>
