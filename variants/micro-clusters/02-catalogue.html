:root{--bg:#050505;--fg:#d8f2df;--grain:.08}*,*::before,*::after{box-sizing:border-box}html,body{margin:0;height:100%}
body{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--fg);position:relative}
body::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:var(--grain,.06);mix-blend-mode:overlay;pointer-events:none}
.r{display:flex;align-items:center}.c{display:flex;flex-direction:column}
.m{font:500 9.5px/1.25 Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 9px;border:1.4px solid currentColor;border-radius:99px;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bx{display:inline-flex;align-items:center;height:18px;padding:0 7px;border:1.4px solid currentColor;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.bx.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cds{display:inline-flex}.cd{font:600 9.5px Plex;font-style:normal;width:17px;height:17px;border:1.3px solid currentColor;border-radius:50%;display:grid;place-items:center;margin-left:-2px;background:var(--bg)}
.cd:first-child{margin-left:0}
.sep{height:1.4px;background:currentColor;align-self:stretch}
.dash{border-top:1.4px dashed currentColor;align-self:stretch}
.cluster{position:relative}
.l{font:500 13px/1.35 'Plex';letter-spacing:.06em;text-align:center;text-transform:uppercase}
.big{font:800 72px/0.86 Archivo;font-stretch:88%;letter-spacing:-.01em;text-align:center}
.big sup{font-size:16px;vertical-align:top;margin-left:4px}
.sbadge{width:62px;height:30px;border:1.6px solid currentColor;border-radius:99px;display:grid;place-items:center;font:700 13px Archivo;letter-spacing:.04em}
.n{width:16px;height:16px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:700 9px Plex}</style></head><body><main class="cluster" aria-label="Shalak Bhavsar"><div class="c " style="gap:10px;align-items:center"><div class="r " style="gap:6px;"><span class="big" style="font-size:22px;font-stretch:125%">SB</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"  style="display:block;flex:none"><circle cx="12" cy="12" r="10.5" stroke-width="1.3"/><ellipse cx="12" cy="12" rx="4.5" ry="10.5" stroke-width="1.3"/><path d="M1.5 12h21M3.5 6.5h17M3.5 17.5h17" stroke-width="1.3"/></svg><span class="n">1</span></div><span class="l" style="margin-top:10px">Index SB/2.6</span><span class="big" style="">SHALAK<br>BHAVSAR<sup>®</sup></span><span class="l" style="">Interfaces, mostly.<br>Systems, often.<br>Objects, sometimes.<br>Worldwide © 2026<br>Made by hand</span><div class="r " style="gap:40px;margin-top:12px"><span class="sbadge">SB</span><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor"  style="display:block;flex:none"><rect x="2" y="2" width="22" height="5" fill="currentColor" stroke="none"/><rect x="2" y="10.5" width="22" height="5" fill="currentColor" stroke="none"/><rect x="2" y="19" width="22" height="5" fill="currentColor" stroke="none"/></svg><span class="sbadge" style="width:auto;padding:0 8px;gap:4px;display:flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"  style="display:block;flex:none"><circle cx="12" cy="12" r="10.5" stroke-width="1.3"/><ellipse cx="12" cy="12" rx="4.5" ry="10.5" stroke-width="1.3"/><path d="M1.5 12h21M3.5 6.5h17M3.5 17.5h17" stroke-width="1.3"/></svg> SB</span></div><span class="l" style="letter-spacing:.3em;margin-top:4px">— · — · — · —</span></div></main></body></html>
