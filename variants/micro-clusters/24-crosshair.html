:root{--bg:#0a0c0e;--fg:#e9eef2;--grain:.08}*,*::before,*::after{box-sizing:border-box}html,body{margin:0;height:100%}
body{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--fg);position:relative}
body::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:var(--grain,.06);mix-blend-mode:overlay;pointer-events:none}
.r{display:flex;align-items:center}.c{display:flex;flex-direction:column}
.m{font:500 9.5px/1.25 Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 9px;border:1.4px solid currentColor;border-radius:99px;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bx{display:inline-flex;align-items:center;height:18px;padding:0 7px;border:1.4px solid currentColor;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.bx.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cds{display:inline-flex}.cd{font:600 9.5px Plex;font-style:normal;width:17px;height:17px;border:1.3px solid currentColor;border-radius:50%;display:grid;place-items:center;margin-left:-2px;background:var(--bg)}
.cd:first-child{margin-left:0}
.sep{height:1.4px;background:currentColor;align-self:stretch}
.dash{border-top:1.4px dashed currentColor;align-self:stretch}
.cluster{position:relative}
.nm{font:500 28px Archivo;letter-spacing:.02em}.hl{color:#ff3b2f}</style></head><body><main class="cluster" aria-label="Shalak Bhavsar"><div style="position:relative;width:520px;height:300px;"><svg width="520" height="300" fill="none" stroke="currentColor" style="position:absolute;inset:0;opacity:.6"><line x1="0" y1="150" x2="130" y2="150"/><line x1="390" y1="150" x2="520" y2="150"/><line x1="260" y1="0" x2="260" y2="110"/><line x1="260" y1="190" x2="260" y2="300"/><line x1="10" y1="146" x2="10" y2="154"/><line x1="30" y1="146" x2="30" y2="154"/><line x1="50" y1="146" x2="50" y2="154"/><line x1="70" y1="146" x2="70" y2="154"/><line x1="90" y1="146" x2="90" y2="154"/><line x1="110" y1="146" x2="110" y2="154"/><line x1="390" y1="146" x2="390" y2="154"/><line x1="410" y1="146" x2="410" y2="154"/><line x1="430" y1="146" x2="430" y2="154"/><line x1="450" y1="146" x2="450" y2="154"/><line x1="470" y1="146" x2="470" y2="154"/><line x1="490" y1="146" x2="490" y2="154"/><line x1="510" y1="146" x2="510" y2="154"/><circle cx="260" cy="150" r="70" stroke-dasharray="3 6"/></svg><span style="position:absolute;left:260px;top:150px;transform:translate(-50%,-50%) rotate(0deg);display:block"><span class="nm" style="">Shalak Bhavsar</span></span><span class="m" style="position:absolute;left:272px;top:20px;transform:translate(0,-50%);">N 000.00°</span><span class="m" style="position:absolute;left:272px;top:282px;transform:translate(0,-50%);">S 180.00°</span><span class="m" style="position:absolute;left:4px;top:134px;transform:translate(0,-50%);">−X</span><span class="m" style="position:absolute;left:516px;top:134px;transform:translate(-100%,-50%);">+X</span><span style="position:absolute;left:380px;top:76px;transform:translate(-50%,-50%) rotate(0deg);display:block"><span class="m hl" style="">● TARGET ACQUIRED</span></span><span style="position:absolute;left:170px;top:212px;transform:translate(-50%,-50%) rotate(0deg);display:block"><span class="m" style="opacity:.7">Zoom ×2.6 · focus l
