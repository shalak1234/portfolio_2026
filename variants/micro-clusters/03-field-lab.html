.dash{border-top:1.4px dashed currentColor;align-self:stretch}
.cluster{position:relative}
body{background:linear-gradient(160deg,#8b949a 0%,#59626a 35%,#2b3237 70%,#1d2226 100%)}
.cluster{filter:drop-shadow(0 0 6px rgba(60,255,122,.45))}
