body{background:conic-gradient(from 220deg at 55% 45%,#f4c4ff,#bfe8ff,#d9ffd6,#fff4bf,#ffd0c4,#f4c4ff)}
.sq{display:grid;grid-template-columns:repeat(3,auto);gap:0;border:2px solid #0c0c0c}
