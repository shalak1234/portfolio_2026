:root{--bg:#1c1b19;--fg:#f0e6d2;--grain:.1}*,*::before,*::after{box-sizing:border-box}html,body{margin:0;height:100%}
body{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--fg);position:relative}
body::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:var(--grain,.06);mix-blend-mode:overlay;pointer-events:none}
.r{display:flex;align-items:center}.c{display:flex;flex-direction:column}
.m{font:500 9.5px/1.25 Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 9px;border:1.4px solid currentColor;border-radius:99px;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bx{display:inline-flex;align-items:center;height:18px;padding:0 7px;border:1.4px solid currentColor;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.bx.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cds{display:inline-flex}.cd{font:600 9.5px Plex;font-style:normal;width:17px;height:17px;border:1.3px solid currentColor;border-radius:50%;display:grid;place-items:center;margin-left:-2px;background:var(--bg)}
.cd:first-child{margin-left:0}
.sep{height:1.4px;background:currentColor;align-self:stretch}
.dash{border-top:1.4px dashed currentColor;align-self:stretch}
.cluster{position:relative}
.nm{font:600 13px Plex;letter-spacing:.24em;text-transform:uppercase}</style></head><body><main class="cluster" aria-label="Shalak Bhavsar"><div style="position:relative;width:300px;height:200px"><svg width="300" height="150" viewBox="0 0 300 150" fill="none" stroke="currentColor" stroke-width="1.4" style="position:absolute;left:0;top:0;overflow:visible"><line x1="26" y1="10" x2="26" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="34" y1="10" x2="34" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="42" y1="10" x2="42" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="50" y1="10" x2="50" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="22" y1="44" x2="56" y2="16" stroke-width="2.4" stroke-linecap="round"/><line x1="70" y1="10" x2="70" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="78" y1="10" x2="78" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="86" y1="10" x2="86" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="94" y1="10" x2="94" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="66" y1="44" x2="100" y2="16" stroke-width="2.4" stroke-linecap="round"/><line x1="114" y1="10" x2="114" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="122" y1="10" x2="122" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="130" y1="10" x2="130" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="138" y1="10" x2="138" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="110" y1="44" x2="144" y2="16" stroke-width="2.4" stroke-linecap="round"/><line x1="158" y1="10" x2="158" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="166" y1="10" x2="166" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="174" y1="10" x2="174" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="182" y1="10" x2="182" y2="50" stroke-width="2.4" stroke-linecap="round"/><line x1="154" y1="44" x2="188" y2="16" stroke-width="2.4" stroke-linecap="round"/><l
