@font-face{font-family:Plex;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2');font-weight:600}

:root{--bg:#f6f1e7;--fg:#1a1a1a;--grain:.06}*,*::before,*::after{box-sizing:border-box}html,body{margin:0;height:100%}
body{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--fg);position:relative}
body::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:var(--grain,.06);mix-blend-mode:overlay;pointer-events:none}
.r{display:flex;align-items:center}.c{display:flex;flex-direction:column}
.m{font:500 9.5px/1.25 Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 9px;border:1.4px solid currentColor;border-radius:99px;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bx{display:inline-flex;align-items:center;height:18px;padding:0 7px;border:1.4px solid currentColor;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.bx.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cds{display:inline-flex}.cd{font:600 9.5px Plex;font-style:normal;width:17px;height:17px;border:1.3px solid currentColor;border-radius:50%;display:grid;place-items:center;margin-left:-2px;background:var(--bg)}
.cd:first-child{margin-left:0}
.sep{height:1.4px;background:currentColor;align-self:stretch}
.dash{border-top:1.4px dashed currentColor;align-self:stretch}
.cluster{position:relative}
.nm{font:italic 24px Instrument}</style></head><body><main class="cluster" aria-label="Shalak Bhavsar"><div style="position:relative;width:460px;height:180px;"><svg width="460" height="120" viewBox="0 0 460 120" fill="none" stroke="currentColor" style="position:absolute;left:0;top:0;overflow:visible" ><line x1="0" y1="20" x2="460" y2="20" stroke-width="1"/><line x1="0" y1="30" x2="460" y2="30" stroke-width="1"/><line x1="0" y1="40" x2="460" y2="40" stroke-width="1"/><line x1="0" y1="50" x2="460" y2="50" stroke-width="1"/><line x1="0" y1="60" x2="460" y2="60" stroke-width="1"/><ellipse cx="70" cy="60" rx="6.5" ry="4.6" transform="rotate(-20 70 60)" fill="currentColor" stroke="none"/><line x1="76" y1="60" x2="76" y2="30" stroke-width="1.6"/><ellipse cx="110" cy="45" rx="6.5" ry="4.6" transform="rotate(-20 110 45)" fill="currentColor" stroke="none"/><line x1="116" y1="45" x2="116" y2="15" stroke-width="1.6"/><ellipse cx="150" cy="55" rx="6.5" ry="4.6" transform="rotate(-20 150 55)" fill="currentColor" stroke="none"/><line x1="156" y1="55" x2="156" y2="25" stroke-width="1.6"/><ellipse cx="190" cy="40" rx="6.5" ry="4.6" transform="rotate(-20 190 40)" fill="currentColor" stroke="none"/><line x1="196" y1="40" x2="196" y2="10" stroke-width="1.6"/><ellipse cx="250" cy="50" rx="6.5" ry="4.6" transform="rotate(-20 250 50)" fill="currentColor" stroke="none"/><line x1="256" y1="50" x2="256" y2="20" stroke-width="1.6"/><ellipse cx="290" cy="65" rx="6.5" ry="4.6" transform="rotate(-20 290 65)" fill="currentColor" stroke="none"/><line x1="296" y1="65" x2="296" y2="35" stroke-width="1.6"/><ellipse cx="330" cy="55" rx="6.5" ry="4.6" transform="rotate(-20 330 55)" fill="currentColor" stroke="none"/><line x1="336" y1="55" x2="336" y2="25" stroke-width="1.6"/><ellipse cx="370" cy="35" rx="6.5" ry="4.6" transform="rotate(-20 370 35)" fill="currentColor" stroke="none"/><line x1="376" y1="35" x2="376" y2="5" stroke-width="1.6"/><ellipse cx="410" cy="45" rx="6.5" ry="4.6" transform="rotate(-20 410 45)" fill="currentColor" stroke="none"/><line x1="416" y1="45" x2="416" y2="15" stroke-width="1.6"/><path d="M30 78 C14 70 18 46 36 44 C50 44 50 64 34 62 C22 60 26 40 40 28 C48 20 44 6 38 8 C30 10 34 40 36 70 C37 84 28 86 24 80" stroke-width="2"/><line x1="230" y1="20" x2="230" y2="60" stroke-width="1.4"/><line x1="458" y1="20" x2="458" y2="60" stroke-width="3"/></svg><span style="position:absolute;left:82px;top:112px;transform:translate(-50%,-50%) rotate(0deg);display:block;white-space:nowrap"><span class="m" style="">♩ = 96 · con curiosità</span></span><span style="position:absolute;left:230px;top:140px;transform:translate(-50%,-50%) rotate(0deg);display:block;white-space:nowrap"><span class="nm" style="">“Shalak Bhavsar” — op. 26, for interface and quiet</span></span><span style="position:absolute;left:400px;top:112px;transform:translate(-50%,-50%) rotate(0deg);display:block;white-space:nowrap"><span class="m" style="font-style:italic;text-transform:none;font-family:Instrument;font-size:14px">fine</span></span></div></main></body></html>
