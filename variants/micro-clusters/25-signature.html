:root{--bg:#fbf8f2;--fg:#1a2a6c;--grain:.04}*,*::before,*::after{box-sizing:border-box}html,body{margin:0;height:100%}
body{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--fg);position:relative}
body::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:var(--grain,.06);mix-blend-mode:overlay;pointer-events:none}
.r{display:flex;align-items:center}.c{display:flex;flex-direction:column}
.m{font:500 9.5px/1.25 Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 9px;border:1.4px solid currentColor;border-radius:99px;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.pill.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bx{display:inline-flex;align-items:center;height:18px;padding:0 7px;border:1.4px solid currentColor;font:600 9px Plex;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.bx.f{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cds{display:inline-flex}.cd{font:600 9.5px Plex;font-style:normal;width:17px;height:17px;border:1.3px solid currentColor;border-radius:50%;display:grid;place-items:center;margin-left:-2px;background:var(--bg)}
.cd:first-child{margin-left:0}
.sep{height:1.4px;background:currentColor;align-self:stretch}
.dash{border-top:1.4px dashed currentColor;align-self:stretch}
.cluster{position:relative}
.sig{font:italic 78px/0.9 Instrument;letter-spacing:-.01em;transform:rotate(-6deg)}</style></head><body><main class="cluster" aria-label="Shalak Bhavsar"><div style="position:relative;width:460px;height:260px;"><span style="position:absolute;left:220px;top:110px;transform:translate(-50%,-50%) rotate(0deg);display:block"><span class="sig" style="">Shalak Bhavsar</span></span><span style="position:absolute;left:236px;top:176px;transform:translate(-50%,-50%) rotate(0deg);display:block"><svg width="300" height="18" viewBox="0 0 300 18" fill="none" stroke="currentColor"  style="display:block;flex:none"><path d="M2 12 C 80 2, 160 20, 298 6" stroke-width="1.6"/></svg></span><span class="m" style="position:absolute;left:40px;top:30px;transform:translate(0,-50%);">Approved for release</span><span class="m" style="position:absolute;left:420px;top:30px;transform:translate(-100%,-50%);">Nº 026</span><span style="position:absolute;left:400px;top:210px;transform:translate(-50%,-50%) rotate(0deg);display:block"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"  style="display:block;flex:none"><path d="M12 1v22M1 12h22" stroke-width="1.4"/><path d="M12 6c0 4 2 6 6 6-4 0-6 2-6 6 0-4-2-6-6-6 4 0 6-2 6-6z" fill="currentColor" stroke="none"/></svg></span><span style="position:absolute;left:60px;top:214px;transform:translate(-50%,-50%) rotate(0deg);display:block"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"  style="display:block;flex:none"><circle cx="12" cy="12" r="10.5" stroke-width="1.3"/><circle cx="12" cy="12" r="6" stroke-width="1.3"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/></svg></span><span class="m" style="position:absolute;left:230px;top:214px;transform:translate(-50%,-50%);">Signed · sealed · shipped</span><span class="m" style="position:absolute;left:230px;top:238px;transform:translate(-50%,-50%);opacity:.7">08 / 10 / 2026</span></div></main></body></html>
